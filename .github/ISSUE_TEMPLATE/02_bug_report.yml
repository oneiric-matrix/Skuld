name: Bug Report (with Root Cause Analysis)
description: Report a bug with investigated Root Cause Analysis (RCA) and suggested fix
title: "[Gen][BUG]: "
labels: ["bug", "triaging"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report & RCA Workflow
        > **Rule**: For any bug, root cause analysis (RCA) must be investigated, then logged with the RCA findings and suggested fix.
  - type: textarea
    id: bug-summary
    attributes:
      label: Bug Description & Observed Behavior
      description: What is happening versus what was expected to happen?
      placeholder: Clear, concise summary of the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Steps or conditions to trigger the defect.
      placeholder: |
        1. Go to '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: rca
    attributes:
      label: Root Cause Analysis (RCA)
      description: Deep dive into WHY the defect occurred (code location, logic flaw, state race, etc.).
      placeholder: Detailed RCA findings...
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix
      description: Proposed technical remedy or patch.
      placeholder: Outline the code change or architecture adjustment to resolve the root cause...
    validations:
      required: true
