name: Nightly Android APK Build & Release

on:
  push:
    branches: [ nightly ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Verify Pre-Installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version || $ANDROID_HOME/tools/bin/sdkmanager --version || true

      - name: Install Dependencies
        run: npm ci

      - name: Generate Continuous Native Android Source
        run: npx expo prebuild --platform android --clean --no-install

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease

      - name: Locate and Package Output APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Skuld-Nightly.apk \;

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skuld-Nightly-APK
          path: build-output/Skuld-Nightly.apk
          retention-days: 14

      - name: Publish Nightly GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly-latest
          name: "Skuld Nightly Build (Latest)"
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ### 📱 Skuld Nightly Standalone APK

            This release was automatically compiled from branch `nightly`.

            #### How to Install on Your Phone:
            1. Download **`Skuld-Nightly.apk`** below on your Android device.
            2. Open the file and tap **Install** (Allow installation from browser if prompted).
            3. Open Skuld and authenticate with your biometric passcode to unlock your Hardware Vault.
            4. Add the **Skuld Quick Talk Widget** to your home screen!
          files: build-output/Skuld-Nightly.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
